name: Sync Drift Check

on:
  pull_request:
    paths:
      - "Projects/**"
      - "src/content/projects/**"
      - "src/data/about.ts"
      - "src/data/about-chat.ts"
      - "src/data/portfolio-context.static.json"
      - "src/data/portfolio-context.json"
      - "scripts/sync-projects.mjs"
      - "scripts/build-chat-context.mjs"
      - "Experience/**"
      - "src/content/experience/**"
      - "scripts/sync-experience.mjs"
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Projects/ <-> MDX sync is clean
        run: pnpm sync:check

      - name: Verify Experience/ <-> MDX sync is clean
        run: pnpm sync:experience:check

      - name: Verify portfolio-context.json is in sync with sources
        run: pnpm build:chat-context:check

      # Generate Cloudflare worker types first (worker-configuration.d.ts is
      # gitignored) so `astro check` has the Env bindings it needs — mirrors
      # the ordering in the `build` script (wrangler types && astro check).
      - name: Generate Cloudflare worker types
        run: pnpm types

      # WR-01: run the Zod schema through `astro check` so schema-invalid
      # content frontmatter fails pre-merge instead of only at the Cloudflare
      # deploy build. The drift gates above prove body↔source parity; this
      # proves schema validity.
      - name: Type-check content collections (Zod)
        run: pnpm check
