name: Sync Drift Check

on:
  pull_request:
    paths:
      - "Projects/**"
      - "src/content/projects/**"
      - "src/data/about.ts"
      - "src/data/about-chat.ts"
      - "src/data/portfolio-context.static.json"
      - "src/data/portfolio-context.json"
      - "scripts/sync-projects.mjs"
      - "scripts/build-chat-context.mjs"
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Projects/ <-> MDX sync is clean
        run: pnpm sync:check

      - name: Verify portfolio-context.json is in sync with sources
        run: pnpm build:chat-context:check
